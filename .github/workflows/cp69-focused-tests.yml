name: CP69 focused observation tests

on:
  pull_request:
    paths:
      - "cp69_runtime_observation.py"
      - "test_cp69_runtime_observation.py"
      - "arunda_pipeline.py"
      - ".github/workflows/cp69-focused-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp69-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile producer and tests
        run: python -m py_compile arunda_pipeline.py cp69_runtime_observation.py test_cp69_runtime_observation.py
      - name: Run focused CP69 producer tests
        run: python test_cp69_runtime_observation.py
