name: Atomic intent claim contract

on:
  pull_request:
    paths:
      - "exchange_execution_atomic_intent_claim_store_v0_1.py"
      - "test_exchange_execution_atomic_intent_claim_store_v0_1.py"
      - "exchange_execution_idempotency_contract_v0_1.py"
      - "test_exchange_execution_idempotency_contract_v0_1.py"
      - "exchange_execution_order_reconciliation_contract_v0_1.py"
      - "test_exchange_execution_order_reconciliation_contract_v0_1.py"
      - "mcp01_compact_event_evidence_v0_1.py"
      - "mcp01_execution_attempt_evidence_v0_1.py"
      - "test_mcp01_execution_attempt_evidence_v0_1.py"
      - ".github/workflows/atomic-intent-claim-contract.yml"
  push:
    branches:
      - "fix/atomic-intent-claim-store-20261012"
    paths:
      - "exchange_execution_atomic_intent_claim_store_v0_1.py"
      - "test_exchange_execution_atomic_intent_claim_store_v0_1.py"
      - "exchange_execution_idempotency_contract_v0_1.py"
      - "test_exchange_execution_idempotency_contract_v0_1.py"
      - "exchange_execution_order_reconciliation_contract_v0_1.py"
      - "test_exchange_execution_order_reconciliation_contract_v0_1.py"
      - "mcp01_compact_event_evidence_v0_1.py"
      - "mcp01_execution_attempt_evidence_v0_1.py"
      - "test_mcp01_execution_attempt_evidence_v0_1.py"
      - ".github/workflows/atomic-intent-claim-contract.yml"

permissions:
  contents: read

jobs:
  offline-claim-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline contract and evidence mapping tests
        run: python -m pytest -q test_exchange_execution_idempotency_contract_v0_1.py test_exchange_execution_order_reconciliation_contract_v0_1.py test_exchange_execution_atomic_intent_claim_store_v0_1.py test_mcp01_execution_attempt_evidence_v0_1.py
