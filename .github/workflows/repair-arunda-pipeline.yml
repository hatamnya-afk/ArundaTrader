name: repair-arunda-pipeline
on:
  push:
    branches: [arunda-fix-v1]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and compile
        run: python repair_arunda_pipeline_v1.py
      - name: Commit fixed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arunda_pipeline_FIXED.py
          git diff --cached --quiet || git commit -m "Create validated fixed arunda_pipeline"
          git push
