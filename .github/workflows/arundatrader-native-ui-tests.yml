name: ArundaTrader native UI tests

on:
  pull_request:
    paths:
      - "arundatrader_live_ui.py"
      - "arundatrader_observation_consumer.py"
      - "arundatrader_runtime_analysis.py"
      - "run_live_arundatrader_ui.py"
      - "test_arundatrader_native_ui.py"
      - ".github/workflows/arundatrader-native-ui-tests.yml"
  push:
    branches:
      - "ui/cp69-native-trader-ui-20261016"
    paths:
      - "arundatrader_live_ui.py"
      - "arundatrader_observation_consumer.py"
      - "arundatrader_runtime_analysis.py"
      - "run_live_arundatrader_ui.py"
      - "test_arundatrader_native_ui.py"
      - ".github/workflows/arundatrader-native-ui-tests.yml"

jobs:
  native-ui-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile native UI modules
        run: python -m py_compile arundatrader_live_ui.py arundatrader_observation_consumer.py arundatrader_runtime_analysis.py run_live_arundatrader_ui.py test_arundatrader_native_ui.py
      - name: Run focused read-only consumer tests
        run: python -m unittest -v test_arundatrader_native_ui.py
