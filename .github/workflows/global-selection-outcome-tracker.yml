name: Global Selection Outcome Tracker

on:
  pull_request:
    branches:
      - operational-main-20261007
    paths:
      - "global_selection_outcome_tracker_v0_1.py"
      - "tests/test_global_selection_outcome_tracker_v0_1.py"
      - ".github/workflows/global-selection-outcome-tracker.yml"
  push:
    branches:
      - fix/global-selection-outcome-loop-20261012
    paths:
      - "global_selection_outcome_tracker_v0_1.py"
      - "tests/test_global_selection_outcome_tracker_v0_1.py"
      - ".github/workflows/global-selection-outcome-tracker.yml"

permissions:
  contents: read

jobs:
  focused-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused global selection outcome tests
        run: python -m pytest -q tests/test_global_selection_outcome_tracker_v0_1.py
