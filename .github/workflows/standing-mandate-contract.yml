name: Standing mandate contract

on:
  pull_request:
    paths:
      - "management_execution_authorization_v0_1.py"
      - "execution_authorization_boundary_v0_1.py"
      - "test_management_execution_authorization_v0_1.py"
      - "test_execution_authorization_boundary_standing_mandate_v0_1.py"
      - ".github/workflows/standing-mandate-contract.yml"
  push:
    branches:
      - "feature/execution-outcome-evidence-contract-20261015"
    paths:
      - "management_execution_authorization_v0_1.py"
      - "execution_authorization_boundary_v0_1.py"
      - "test_management_execution_authorization_v0_1.py"
      - "test_execution_authorization_boundary_standing_mandate_v0_1.py"
      - ".github/workflows/standing-mandate-contract.yml"

permissions:
  contents: read

jobs:
  standing-mandate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test management and execution authorization boundaries
        run: python -m pytest -q test_management_execution_authorization_v0_1.py test_execution_authorization_boundary_standing_mandate_v0_1.py test_final_execution_attempt_contract_v0_1.py
