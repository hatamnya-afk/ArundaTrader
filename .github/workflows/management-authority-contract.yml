name: Management Authority Contract

on:
  pull_request:
    paths:
      - "management_authority_service/**"
      - ".github/workflows/management-authority-contract.yml"
  push:
    branches:
      - "fix/explicit-order-attempt-runtime-wiring-20261016"
    paths:
      - "management_authority_service/**"
      - ".github/workflows/management-authority-contract.yml"

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management_authority_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run authority contract tests
        run: python -m pytest -q
