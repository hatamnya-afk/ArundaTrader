name: Canonical order-request static contract

on:
  pull_request:
    branches:
      - main
      - integration/pr13-pr14-attempt-contract-20261010
      - management/phase-entry-ci-candidate-20261011
      - fix/production-final-attempt-dispatch-20261011
      - fix/final-attempt-context-handoff-20261011
      - fix/dynamic-risk-budget-sizing-bridge-20261011
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/canonical-order-request-static.yml"
  push:
    branches:
      - integration/pr13-pr14-attempt-contract-20261010
      - management/phase-entry-ci-candidate-20261011
      - fix/production-final-attempt-dispatch-20261011
      - fix/final-attempt-context-handoff-20261011
      - fix/dynamic-risk-budget-sizing-bridge-20261011
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/canonical-order-request-static.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pipeline without running it
        run: python -m py_compile arunda_pipeline.py dynamic_risk_budget_sizing_bridge_v0_1.py test_dynamic_risk_budget_sizing_bridge_v0_1.py
      - name: Run focused contract tests
        run: python -m unittest -v test_canonical_order_request_builder_contract_v0_1.py test_exchange_execution_boundary_contract_v0_1.py test_dynamic_risk_budget_sizing_bridge_v0_1.py
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run full regression suite
        run: python -m pytest -q
