          smart_risk_portfolio_bridge_v0_1.py
          validated_stop_risk_policy_source_contract_v0_1.py
          market_analysis_engine.py
          signal_logic.py
          indicator_engine.py
          market_structure_engine.py
          market_regime_engine.py
          feature_engine.py
          decision_engine.py
          decision_contract.py
          opportunity_engine.py
